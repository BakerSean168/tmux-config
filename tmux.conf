# ============================================================
#  Unified tmux configuration  (managed via dotfiles repo)
#  Source of truth: github.com/BakerSean168/tmux-config
#  Merged from the WSL + DO-bodysense setups.
# ============================================================
set -g default-command /usr/bin/zsh
set -g default-shell /usr/bin/zsh

# 鼠标支持 (拖拽调整窗格 / 点击切换)
set -g mouse on

# 256 色 + True Color (保证 Neovim 主题不变灰)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 前缀键 Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 分割窗口: | 垂直, - 水平
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# 重载配置: 前缀键 + r
bind r source-file ~/.tmux.conf \; display "Tmux 配置已刷新!"

# ----- 插件管理 (TPM) -----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# resurrect 恢复 nvim / opencode 进程
set -g @resurrect-processes 'nvim opencode'

# 初始化 TPM (必须放在文件最末尾!)
run '~/.tmux/plugins/tpm/tpm'

# 新窗口 / 分屏自动继承当前目录
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
